version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-replica-set.js:/docker-entrypoint-initdb.d/init-replica-set.js:ro
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge